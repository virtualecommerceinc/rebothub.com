    <radialGradient id="halo"><stop stop-color="#FFFDF4" stop-opacity=".8"/><stop offset="1" stop-color="#FFFDF4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#526453" stroke-opacity=".08"/></pattern>
