<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Everyday robots, and a glimpse of what comes next</title>
  <desc id="desc">Original concept illustration. A low disc vacuum in the foreground, a larger wheeled lawn robot behind it, and a faint articulated humanoid silhouette further back. These are fictional designs, not products or inventory.</desc>
